        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: state_conflict
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
        '413':
          description: 请求内容过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request_size
      description: 角色：analyst, reviewer, admin。
      x-roles:
      - analyst
      - reviewer
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
            example:
              values:
              - mit
              - Apache2
              - GPL-2.0-only
  /match:
    post:
      operationId: current_post_match
      tags:
      - 许可证
      summary: 匹配许可证正文
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
