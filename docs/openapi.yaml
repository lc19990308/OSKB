        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
