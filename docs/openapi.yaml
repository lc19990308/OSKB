        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
        '413':
          description: 请求内容过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request_size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpressionRequest'
            example:
              value: MIT OR Apache-2.0
  /normalize:
    post:
      operationId: current_post_normalize
      tags:
