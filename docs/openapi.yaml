      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extraction'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: state_conflict
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
        '413':
          description: 请求内容过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request_size
      description: documents包含1至32个文本文件，内容合计不超过2MiB；kind省略时自动识别。
