openapi: 3.0.3
info:
  title: Tosslib 三包后端接口
  version: 2026.10.12
  description: 现有接口按当前服务整理；/api/v1接口标为待实现。请求和响应使用UTF-8 JSON，文件下载接口除外。
servers:
- url: http://127.0.0.1:8787
  description: 后端访问地址
tags:
- name: 服务
- name: 许可证
- name: 知识库与规则
- name: AI辅助
- name: 任务
- name: 报告与导出
- name: 评分与治理
- name: 对象与依赖
- name: 代码特征
- name: 待实现 · 第一包
- name: 待实现 · 第四包
- name: 待实现 · 第二包
- name: 待实现 · 通用服务
paths:
  /health:
    get:
      operationId: current_get_health
      tags:
      - 服务
      summary: 检查服务状态
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                records: 2712
                text_model: ready
                task_worker_alive: true
                linked_sources_enabled: true
                local_generation_configured: true
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: state_conflict
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
  /audit:
    get:
      operationId: current_get_audit
      tags:
      - 许可证
      summary: 查询许可证库统计
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: state_conflict
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
  /rules:
    get:
      operationId: current_get_rules
      tags:
      - 知识库与规则
      summary: 查询规则版本及使用场景
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  scenarios:
                    type: array
                    items:
                      type: string
                      enum: &id007
                      - repository_coexistence
                      - package_distribution
                      - source_copy
                      - file_merge
                      - static_link
                      - dynamic_link
                      - plugin_call
                      - independent_process
                      - saas
                      - data_fusion
                      - commercial_distribution
                      - closed_source_integration
                  sources:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                additionalProperties: true
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
