components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 填写分配的访问Token，不带Bearer前缀。
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: 错误代码
        status:
          type: string
          description: 模型或服务状态
      additionalProperties: true
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          properties: {}
          additionalProperties: true
        retry_at:
          type: string
          format: date-time
          nullable: true
      required:
      - code
      - message
    Document:
      type: object
      properties:
        path:
          type: string
          description: 文件名或相对路径
          minLength: 1
          maxLength: 1024
        content:
          type: string
          description: UTF-8文本内容
        kind:
          type: string
          description: 省略时自动识别
          enum:
          - auto
          - json
          - text
          - spdx
          - cyclonedx
          - npm
          - composer
          default: auto
      required:
      - path
      - content
    DocumentsRequest:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          minItems: 1
          maxItems: 32
      required:
      - documents
    TaskCreate:
      type: object
      properties:
        title:
          type: string
          description: 任务名称
          maxLength: 200
          default: 许可证证据任务
          minLength: 1
        reviewers:
          type: array
          items:
            type: string
            description: 复核账号名称
            maxLength: 100
            minLength: 1
          maxItems: 16
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          minItems: 1
          maxItems: 32
        request_key:
          type: string
          description: 幂等键；同一账号同一键复用原任务
          pattern: ^[A-Za-z0-9_-]{16,128}$
      required:
      - documents
    Task:
      type: object
      properties:
        id: *id002
        owner:
          type: string
        reviewers:
          type: array
          items:
            type: string
        title:
          type: string
        state:
          type: string
          enum:
          - pending
          - running
          - paused
          - ready
          - approved
          - rejected
          - failed
          - archived
        input:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        result:
          type: object
          properties:
            schema:
              type: string
            evidence_id: &id008
              type: string
              description: SHA256摘要
              pattern: ^[0-9a-f]{64}$
            documents:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  source_sha256: *id008
                  format:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        pointer:
                          type: string
                        role:
                          type: string
                        subject:
                          type: object
                          properties: {}
                          nullable: true
                          additionalProperties: true
                        mode:
                          type: string
                          enum:
                          - expression
                          - text
                          - name
                        value:
                          type: string
                        ast:
                          $ref: '#/components/schemas/Ast'
                        catalog_resolution:
                          $ref: '#/components/schemas/Ast'
                        exact_text_matches:
                          type: array
                          items:
                            type: object
                            properties: {}
                            additionalProperties: true
                      additionalProperties: true
                  gaps:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                  object_graph:
                    type: object
                    properties: {}
                    nullable: true
                    additionalProperties: true
                additionalProperties: true
          additionalProperties: true
          nullable: true
        error:
          type: string
          nullable: true
        created: &id009
          type: number
          description: Unix时间戳，单位秒
        updated: *id009
        reused_request:
          type: boolean
      required:
      - id
      - state
    TaskSummary:
      type: object
      properties:
        id: *id002
        title:
          type: string
        state:
          type: string
        owner:
          type: string
        created: *id009
        updated: *id009
    LicenseRecord:
