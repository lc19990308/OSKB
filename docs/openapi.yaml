        '413':
          description: 请求内容过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request_size
      description: 角色：analyst, admin。 返回pending后，使用GET /work/task?id={id}查询结果。reviewers使用/work/users返回的reviewer或admin账号。
      x-roles:
      - analyst
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            example:
              title: 许可证分析
              reviewers:
              - reviewer
              documents:
              - *id001
              request_key: license-task-20261012-0001
