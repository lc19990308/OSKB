        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
  /licenses:
    get:
      operationId: current_get_licenses
      tags:
      - 许可证
      summary: 检索许可证
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensePage'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_input
        '403':
          description: Token无效或权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: permission_denied
        '409':
          description: 状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: state_conflict
        '503':
          description: 服务暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: saved_source_unavailable
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 500
          default: ''
        example: MIT
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /expression:
    post:
      operationId: current_post_expression
      tags:
      - 许可证
      summary: 解析许可证表达式
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 返回结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ast:
                    $ref: '#/components/schemas/Ast'
                additionalProperties: true
              example:
                ast:
                  type: OR
                  left:
                    type: license
                    id: MIT
                  right:
                    type: license
